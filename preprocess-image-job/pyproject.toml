[tool.poetry]
name = "ai-avatar-training-preprocess-image-job"
version = "0.1.0"
description = "Raw image preprocessing for ai avatar training"
authors = ["Viktor Vilskyi <viktor.vilskyi@gmail.com>"]
packages = [{ include = "preprocess_image_job" }]

[tool.poetry.dependencies]
python = "^3.10"
google-cloud-storage = "^3.3.1"
opencv-python-headless = "^4.9.0"
numpy = "^1.26.4"
Pillow = "^10.4.0"
torch = "^2.2.0"
torchvision = "^0.17.0"
ultralytics = "^8.3.0"
retina-face = "^0.0.17"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"