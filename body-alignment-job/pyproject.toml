[tool.poetry]
name = "body-alignment-job"
version = "0.1.0"
description = "Vertex AI custom job: SMPLest-X body alignment"
authors = ["Viktor Vilskyi <viktor.vilskyi@gmail.com>"]
packages = [{ include = "body_alignment_job" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
google-cloud-storage = "^2.18.0"
numpy = "^1.26.4"
opencv-python = "^4.10.0"
tqdm = "^4.66.5"
trimesh = "^4.4.3"
smplx = "^0.1.28"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"